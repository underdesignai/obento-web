<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  background: #000;
  zoom: 0.8;
}
.app {
  height: calc(100dvh / 0.8);
  width: 100%;
  display: flex;
  flex-direction: column;
}
.header { height: 50px; background: #222; color: #fff; }
.table-container { flex: 1; overflow: auto; background: #111; }
table { width: 100%; border-collapse: separate; border-spacing: 0; }
th.sticky-col, td.sticky-col {
  position: sticky;
  left: 0;
  background: #e11d48; /* Bright Rose/Red for easy detection */
  color: #fff;
  width: 200px;
  min-width: 200px;
  z-index: 5;
}
th { position: sticky; top: 0; background: #444; color: #fff; z-index: 4; }
th.sticky-col { z-index: 6; }
td { padding: 10px; border: 1px solid #555; color: #fff; min-width: 150px; }
</style>
</head>
<body>
  <div class="app">
    <div class="header">HEADER</div>
    <div class="table-container" id="scrollbox">
      <table>
        <thead>
          <tr>
            <th class="sticky-col">Sticky Header</th>
            <th>Col 1</th><th>Col 2</th><th>Col 3</th><th>Col 4</th><th>Col 5</th><th>Col 6</th><th>Col 7</th><th>Col 8</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="sticky-col">Sticky Row 1</td>
            <td>Data 1</td><td>Data 2</td><td>Data 3</td><td>Data 4</td><td>Data 5</td><td>Data 6</td><td>Data 7</td><td>Data 8</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <script>
    document.getElementById('scrollbox').scrollLeft = 400;
  </script>
</body>
</html>
